<helmet>
<style>
:root{color-scheme:light;--bg:#eef1f6;--surface:#ffffff;--surface-2:#f1f4f9;--line:#e0e5ee;--line-strong:#d2d9e4;--text:#1b2330;--muted:#5f6b7a;--accent:#2f6df6;--accent-soft:rgba(47,109,246,.12);--accent-contrast:#ffffff;--ok:#1a8f4c;--warn:#b7791f;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.08);--radius:14px;--radius-sm:9px}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--surface) 88%,transparent);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.5rem}
.brand__tile{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#7b5cff));display:grid;place-items:center}
.brand__name{font-size:1rem;font-weight:700}
.theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--accent);display:grid;place-items:center}
.status{display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:600;padding:.3rem .6rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line-strong));background:var(--surface);color:var(--ok)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem;display:flex;flex-direction:column;gap:.8rem}
.pill{font-size:.7rem;font-weight:600;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);background:var(--surface-2);white-space:nowrap}
.pill--online{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.pill--warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.chip{display:inline-flex;align-items:center;font-size:.76rem;font-weight:600;padding:.28rem .6rem;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.btn{font-size:.85rem;font-weight:600;padding:.55rem .9rem;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--text)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.step{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;display:grid;place-items:center;font-size:1.1rem}
.label{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.track{position:relative;height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);flex:1}
.track__fill{position:absolute;left:0;top:-1px;bottom:-1px;border-radius:999px;background:var(--accent)}
.track__knob{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(16,24,40,.25)}
.meta{font-size:.78rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:.6rem;padding:.6rem .2rem;border-top:1px solid var(--line)}
.row.is-active{background:var(--accent-soft);border-radius:10px;border-top-color:transparent;padding-left:.6rem;padding-right:.6rem}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex:none;background:var(--surface)}
.radio.is-on{border-color:var(--accent)}
.radio.is-on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tabbar{display:flex;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);padding:6px 8px 14px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);padding:6px 0}
.tabbar a.is-active{color:var(--accent)}
.ico{width:18px;height:18px;flex:none}
.art{width:120px;height:120px;border-radius:14px;background:linear-gradient(135deg,#1d4ed8,#7c3aed 60%,#ec4899);display:grid;place-items:center;color:#fff;flex:none;box-shadow:var(--shadow)}
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--bg)">

      <div style="display: flex; align-items: center; gap: 1rem">
        <button class="step" aria-label="Previous track"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="btn btn--primary" aria-label="Pause" style="width: 56px; height: 56px; border-radius: 50%; padding: 0; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
        <button class="step" aria-label="Next track"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>

      <div style="display: flex; align-items: center; gap: .6rem; width: 100%; padding-top: .4rem; border-top: 1px solid var(--line)">

        <div class="track"><div class="track__fill" style="width: 32%"></div><div class="track__knob" style="left: 32%"></div></div>
        <button class="step" aria-label="Louder" style="width: 40px; height: 40px">+</button>
        <span style="font-size: 1.3rem; font-weight: 700; color: var(--accent); min-width: 2rem; text-align: right">32</span>
      </div>
      <span class="chip">Downstairs · SpeakerA 40 · Office 24</span>
    </section>

    <section class="card" aria-label="Output" style="gap: .2rem; padding: .8rem 1rem">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: .3rem"><strong>Output</strong><a href="#groups" style="font-size: .82rem; font-weight: 600">Edit groups</a></div>
      <div class="row is-active"><span class="radio is-on"></span><div style="flex: 1; min-width: 0"><strong>Downstairs</strong><div class="meta">SpeakerA, Office</div></div><span class="pill pill--online">playing</span></div>

    </section>

  </main>

  <nav class="tabbar" aria-label="Sections">

</div>
