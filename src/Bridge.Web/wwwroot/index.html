<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: fixed elements pad with env(safe-area-inset-*); interactive-widget=resizes-content: Chrome on
         Android shrinks the layout viewport when the on-screen keyboard opens, so fixed elements stay above it
         (UI-SPEC 5.2). Browsers that do not know a token ignore it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>TuneShuttle</title>
    <base href="/" />
    <!-- theme-color is the page ground (--bg) per scheme. An explicit light/dark choice inserts a media-less
         #theme-color-override meta in front of these two (the browser takes the first matching one); "system"
         removes it again (UI-SPEC 2.1). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <script>
        // Theme bootstrap (UI-SPEC 2.2): runs before the stylesheet so the first paint already has the right scheme.
        // localStorage["airplay-bridge-theme"] is "light" or "dark"; absent = follow the OS (no data-theme attribute).
        // ?theme=light|dark|system is a one-shot override for screenshots and shared links; it is never stored.
        // The key keeps the product's old name (AirPlay Bridge, renamed TuneShuttle on 2026-10-10): renaming it would
        // reset every user's stored theme.
        (function () {
            var KEY = "airplay-bridge-theme";
            function applyThemeColor(theme) {
                var override = document.getElementById("theme-color-override");
                if (theme !== "light" && theme !== "dark") { if (override) override.remove(); return; }
                if (!override) {
                    override = document.createElement("meta");
                    override.id = "theme-color-override";
                    override.name = "theme-color";
                    document.head.insertBefore(override, document.head.firstChild);
                }
                override.content = document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: ' + theme + ')"]').content;
            }
            var current = "system";
            function apply(theme, persist) {
                current = theme === "light" || theme === "dark" ? theme : "system";
                if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
                else document.documentElement.removeAttribute("data-theme");
                applyThemeColor(theme);
                if (persist) {
                    try {
                        if (theme === "light" || theme === "dark") localStorage.setItem(KEY, theme);
                        else localStorage.removeItem(KEY);
                    } catch (e) { }
                }
            }
            function stored() {
                try { var t = localStorage.getItem(KEY); return t === "light" || t === "dark" ? t : "system"; }
                catch (e) { return "system"; }
            }
            // read() reports the effective choice, a ?theme= override included, so the picker and the Appearance radios match the page.
            function read() { return current; }
            var q = new URLSearchParams(location.search).get("theme");
            apply(q === "light" || q === "dark" || q === "system" ? q : stored(), false);
            window.bridgeTheme = { apply: function (t) { apply(t, true); }, read: read };
        })();

        // Language bootstrap (UI-SPEC 3.2): Program.Main asks bridgeLang.get() before the first render, sets the
        // culture and then calls bridgeLang.setDocument(code) so <html lang> matches. Same logic as getLang() in
        // js/app.js: ?lang= (one-shot, never stored) -> localStorage["airplay-bridge-lang"] -> navigator.languages ->
        // "" (the caller falls back to "en"). The key keeps the product's old name (AirPlay Bridge, renamed TuneShuttle on
        // 2026-10-10): renaming it would reset every user's stored language.
        (function () {
            var KEY = "airplay-bridge-lang";
            var SUPPORTED = ["de", "en", "fr", "es", "ru", "uk", "pt"];
            function supported(code) {
                if (typeof code !== "string" || code.length < 2) return "";
                var two = code.slice(0, 2).toLowerCase();
                return SUPPORTED.indexOf(two) >= 0 && (code.length === 2 || code.charAt(2) === "-" || code.charAt(2) === "_") ? two : "";
            }
            function get() {
                var q = supported(new URLSearchParams(location.search).get("lang"));
                if (q) return q;
                try { var s = supported(localStorage.getItem(KEY)); if (s) return s; } catch (e) { }
                var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
                for (var i = 0; i < langs.length; i++) { var n = supported(langs[i]); if (n) return n; }
                return "";
            }
            window.bridgeLang = {
                get: get,
                setDocument: function (code) { document.documentElement.lang = code; }
            };
            // The choice is known at first paint: <html lang> follows it now, not only once Program.Main runs.
            document.documentElement.lang = get() || "en";
        })();
    </script>
    <!-- Splash and error strip render before the runtime and the catalog exist: English in the static HTML, swapped for
         the language bootstrap's choice by the inline map at the end of <body> (UI-SPEC 8.1), coloured
         with the tokens of css/app.css so they follow the theme. Declared before the stylesheet so app.css may refine them.
         blazor.webassembly.js shows the strip with style.display = "block", so it is styled for block flow: the .reload
         link carries its own spacing (no flex gap). -->
    <style>
        .splash { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 1.25rem;
                  background: var(--bg); color: var(--muted); font-family: var(--font, system-ui, sans-serif); }
        .splash p { margin: 0; font-size: .95rem; }
        #blazor-error-ui { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
                           padding: .6rem 3.5rem calc(.6rem + env(safe-area-inset-bottom)) 1.25rem;
                           background: var(--err-fill); color: var(--text); border-top: 1px solid var(--err);
                           box-shadow: var(--shadow-lift); font-family: var(--font, system-ui, sans-serif); font-size: .9rem; }
        #blazor-error-ui .reload { display: inline-flex; align-items: center; min-height: 44px; margin-left: .75rem; padding: 0 .5rem;
                                   font-weight: 600; color: var(--accent-ink); }
        #blazor-error-ui .dismiss { position: absolute; top: 50%; right: .5rem; transform: translateY(-50%);
                                    width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
                                    border: 0; border-radius: 50%; background: transparent; color: var(--text);
                                    font: inherit; font-size: 1.2rem; cursor: pointer; }
        #blazor-error-ui .dismiss:focus-visible, #blazor-error-ui .reload:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="splash" role="status"><p>Loading the TuneShuttle app…</p></div>
    </div>
    <div id="blazor-error-ui" role="alert">
        <span>An unhandled error has occurred.</span>
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">×</button>
    </div>
    <script>
        // Splash and error strip in the language the bootstrap resolved (UI-SPEC 8.1): the catalog is not loaded yet, so
        // these four texts live here; English stays in the markup as the fallback without script.
        (function () {
            var T = {
                de: ["Die TuneShuttle-App wird geladen…", "Ein unerwarteter Fehler ist aufgetreten.", "Neu laden", "Ausblenden"],
                fr: ["Chargement de l’app TuneShuttle…", "Une erreur inattendue s’est produite.", "Recharger", "Masquer"],
                es: ["Cargando la app TuneShuttle…", "Se ha producido un error inesperado.", "Recargar", "Descartar"],
                ru: ["Загрузка приложения TuneShuttle…", "Произошла непредвиденная ошибка.", "Перезагрузить", "Скрыть"],
                uk: ["Завантаження застосунку TuneShuttle…", "Сталася неочікувана помилка.", "Перезавантажити", "Сховати"],
                pt: ["Carregando o app TuneShuttle…", "Ocorreu um erro inesperado.", "Recarregar", "Dispensar"]
            };
            var t = T[document.documentElement.lang];
            if (!t) return;
            var splash = document.querySelector("#app .splash p");
            if (splash) splash.textContent = t[0];
            var strip = document.getElementById("blazor-error-ui");
            if (!strip) return;
            strip.querySelector("span").textContent = t[1];
            strip.querySelector(".reload").textContent = t[2];
            strip.querySelector(".dismiss").setAttribute("aria-label", t[3]);
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
